<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтверждение e‑mail</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b0b0b; color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .card { background:#121212; padding:24px 28px; border-radius:12px; box-shadow:0 12px 24px rgba(0,0,0,.35); max-width:520px; width:100%; }
    h1 { margin:0 0 8px; font-size:22px; }
    p { margin:8px 0; color:#cfcfcf; line-height:1.5; }
    .ok { color:#4ecdc4; }
    .err { color:#ff6b6b; }
    .note { color:#aaa; font-size:14px; }
    .btn { margin-top:16px; display:inline-block; background:#ffcc00; color:#000; padding:10px 14px; border-radius:10px; text-decoration:none; font-weight:700; }
    .btn-secondary { background:#2b2b2b; color:#fff; margin-left:8px; }
  </style>
  <script>
    (function(){
      function readUsers(){ try { return JSON.parse(localStorage.getItem('users')||'[]'); } catch { return []; } }
      function writeUsers(list){ localStorage.setItem('users', JSON.stringify(list)); }
      function setCurrentUser(user){ localStorage.setItem('currentUser', JSON.stringify(user)); }
      function byId(id){ return document.getElementById(id); }
      function render(state){
        var title = byId('title');
        var msg = byId('msg');
        var note = byId('note');
        if(state==='ok'){
          title.textContent = 'E‑mail подтверждён';
          title.className = 'ok';
          msg.textContent = 'Спасибо! Ваш аккаунт активирован. Теперь вы можете покупать абонементы и записываться на тренировки.';
          note.innerHTML = '';
        } else if (state==='already'){
          title.textContent = 'Аккаунт уже подтверждён';
          title.className = 'ok';
          msg.textContent = 'Вы ранее уже подтверждали e‑mail. Можно закрыть эту страницу.';
          note.innerHTML = '';
        } else if (state==='expired'){
          title.textContent = 'Ссылка истекла';
          title.className = 'err';
          msg.textContent = 'Срок действия ссылки подтверждения истёк.';
          note.innerHTML = 'Нажмите «Отправить письмо повторно», затем проверьте почту.';
        } else {
          title.textContent = 'Ссылка недействительна';
          title.className = 'err';
          msg.textContent = 'Не удалось подтвердить e‑mail. Возможно, ссылка повреждена или устарела.';
          note.innerHTML = 'Нажмите «Отправить письмо повторно» и используйте новую ссылку.';
        }
      }
      function verify(){
        try{
          var params = new URLSearchParams(location.search);
          var uid = params.get('uid');
          var token = params.get('token');
          if(!uid || !token){ render('bad'); return; }
          var users = readUsers();
          var idx = users.findIndex(function(u){ return String(u.id)===String(uid); });
          if(idx===-1){ render('bad'); return; }
          var u = users[idx];
          if (u.emailVerified===true){ render('already'); return; }
          var now = Date.now();
          if (!u.verificationToken || !u.verificationExpiresAt){ render('bad'); return; }
          if (now > Number(u.verificationExpiresAt)){ render('expired'); return; }
          if (String(u.verificationToken) !== String(token)){ render('bad'); return; }
          u.emailVerified = true;
          u.verificationToken = null;
          u.verificationExpiresAt = null;
          users[idx] = u;
          writeUsers(users);
          try{
            var cu = JSON.parse(localStorage.getItem('currentUser')||'null');
            if (cu && (String(cu.id)===String(u.id) || String(cu.email||'').toLowerCase()===String(u.email||'').toLowerCase())) {
              cu.emailVerified = true; cu.verificationToken=null; cu.verificationExpiresAt=null; setCurrentUser(cu);
            }
          }catch{}
          // Сохраняем uid в кнопке ресенда
          try { byId('resendBtn').dataset.uid = String(u.id); } catch{}
          render('ok');
        }catch(e){ render('bad'); }
      }
      function resend(){
        var btn = byId('resendBtn');
        var uid = (btn && btn.dataset && btn.dataset.uid) || (new URLSearchParams(location.search).get('uid')) || '';
        var url = new URL('./index.html', window.location.href);
        url.searchParams.set('resendVerify','1');
        if (uid) url.searchParams.set('uid', uid);
        window.location.href = url.href;
      }
      document.addEventListener('DOMContentLoaded', verify);
      window.resendVerifyEmail = resend;
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1 id="title">Проверка…</h1>
    <p id="msg">Подождите, подтверждаем ваш e‑mail…</p>
    <p id="note" class="note"></p>
    <a class="btn" href="./index.html">Вернуться на главную</a>
    <button id="resendBtn" class="btn btn-secondary" onclick="resendVerifyEmail()">Отправить письмо повторно</button>
  </div>
</body>
</html>
